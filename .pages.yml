# GENERATED from cms/schema.js — do not edit by hand. Change the schema, then run: npm run cms
# Pages CMS configuration docs: https://pagescms.org/docs/configuration/
media:
  - name: images
    label: "Photos"
    input: assets/img
    output: /assets/img
    rename: safe
    extensions: [webp, jpg, jpeg, png]
  - name: videos
    label: "Videos"
    input: assets/video
    output: /assets/video
    rename: safe
    extensions: [mp4, webm]
content:
  - name: site
    label: "00 · Contact details"
    type: file
    path: content/site.json
    format: json
    fields:
      - name: url
        label: "Canonical website URL"
        type: string
        required: true
        description: "Set this to the public production site origin. SITE_URL overrides it during a Vercel build."
      - name: email
        label: "Email address"
        type: string
        required: true
      - name: phone
        label: "Phone number"
        type: string
        required: true
        description: "Written as you want it shown, e.g. +880 1914 011 329."
      - name: address
        label: "Address lines"
        type: string
        list: true
        required: true
        description: "One line per entry."
      - name: streetAddress
        label: "Structured street address"
        type: string
        required: true
      - name: addressLocality
        label: "Address locality"
        type: string
        required: true
      - name: postalCode
        label: "Postal code"
        type: string
        required: true
      - name: countryCode
        label: "Country code"
        type: string
        required: true
      - name: hours
        label: "Office hours"
        type: string
        required: true
      - name: mapUrl
        label: "Map link"
        type: string
        required: true
        description: "The link opened by the contact page map button."
      - name: officeLabel
        label: "Office label"
        type: string
        required: true
      - name: emailLabel
        label: "Email label"
        type: string
        required: true
      - name: phoneLabel
        label: "Phone label"
        type: string
        required: true
      - name: hoursLabel
        label: "Hours label"
        type: string
        required: true
  - name: navigation
    label: "00 · Navigation & footer links"
    type: file
    path: content/navigation.json
    format: json
    fields:
      - name: primary
        label: "Primary navigation links"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        required: true
        fields:
          - name: label
            label: "Label"
            type: string
            required: true
          - name: href
            label: "Link"
            type: string
            required: true
          - name: hidden
            label: "Hide this item"
            type: boolean
            description: "Tick to take it off the website without deleting it."
      - name: breadcrumbs
        label: "Breadcrumb labels"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        required: true
        fields:
          - name: label
            label: "Label"
            type: string
            required: true
          - name: href
            label: "Page route"
            type: string
            required: true
      - name: homeLabel
        label: "Home link label"
        type: string
        required: true
      - name: homeHref
        label: "Home link destination"
        type: string
        required: true
      - name: contactLabel
        label: "Contact link label"
        type: string
        required: true
      - name: contactHref
        label: "Contact link destination"
        type: string
        required: true
      - name: headerCta
        label: "Header contact button"
        type: string
        required: true
      - name: exploreTitle
        label: "Footer explore heading"
        type: string
        required: true
      - name: sectorsTitle
        label: "Footer sectors heading"
        type: string
        required: true
      - name: officeTitle
        label: "Footer office heading"
        type: string
        required: true
      - name: footerDescription
        label: "Footer firm description"
        type: text
        required: true
        options:
          maxlength: 300
      - name: exploreSectorLabel
        label: "Engagement sector link label"
        type: string
        required: true
        options:
