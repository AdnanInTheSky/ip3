          collapsible:
            collapsed: true
            summary: "{tab}"
        required: true
        fields:
          - name: hidden
            label: "Hide this item"
            type: boolean
            description: "Tick to take it off the website without deleting it."
          - name: tab
            label: "Tab label"
            type: string
            required: true
            options:
              maxlength: 40
          - name: video
            label: "Background video"
            type: object
            required: true
            fields:
              - name: src
                label: "Video file"
                type: file
                required: true
                options:
                  media: videos
                  extensions: [mp4, webm]
              - name: poster
                label: "Poster image"
                type: image
                required: true
                description: "Shown while the video loads and if it cannot play."
                options:
                  media: images
          - name: eyebrow
            label: "Small line above the headline"
            type: string
            required: true
            options:
              maxlength: 90
          - name: h1
            label: "Headline"
            type: string
            required: true
            description: "Wrap words in <em>…</em> to show them in the accent colour."
            options:
              maxlength: 120
          - name: sub
            label: "Sub-headline"
