# Pages CMS configuration docs: https://pagescms.org/docs/configuration/
media:
  - name: insights_images
    label: "Insights — owned infographics"
    input: assets/insights
    output: /assets/insights
    rename: safe
    extensions: [png, webp]
  - name: images
    label: "Photos"
    input: assets/img
    output: /assets/img
    rename: safe
    extensions: [webp, jpg, jpeg, png]
  - name: videos
    label: "Videos"
    input: assets/video
    output: /assets/video
    rename: safe
    extensions: [mp4, webm]
settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "IP3 content: add {path}"
      update: "IP3 content: update {path}"
      delete: "IP3 content: delete {path}"
      rename: "IP3 content: rename {oldPath} to {newPath}"
