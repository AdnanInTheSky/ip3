name: Optimise uploaded media

on:
  # Detect uploads on non-main branches. The privileged optimiser runs below only
  # after Content check completes and uses its copy from the default branch.
  push:
    branches-ignore: [main]
    paths:
      - 'assets/img/**'
      - 'assets/video/**'
  workflow_run:
    workflows: [Content check]
    types: [completed]

permissions:
  contents: read

jobs:
  note-media-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Media processing is queued after the branch content check; the privileged job runs from the default branch."

  optimise:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # This first checkout supplies the trusted workflow code and push credentials.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned CI-only media tools
        run: npm install --no-save --package-lock=false sharp@0.35.5 ffmpeg-static@5.3.0
      # The media checkout is read-only input; no script or package file from it is executed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: media-source
          fetch-depth: 0
          persist-credentials: false
      - name: Recompress changed assets and re-check the resulting commit
        run: node .github/scripts/optimise-media.mjs
        env:
          MEDIA_SOURCE_DIR: media-source
          CHECKED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
